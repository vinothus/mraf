<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" fill="#ffffff"/>
<style>
text { font-family: DejaVu Sans, Segoe UI, Arial, sans-serif; fill: #14202b; }
.t { font-size: 26px; font-weight: 700; }
.s { font-size: 14px; fill: #5b6b7a; }
.b { font-size: 15px; font-weight: 700; }
.n { font-size: 12.5px; }
.small { font-size: 11.5px; fill: #5b6b7a; }
.pin { font-size: 12px; font-family: DejaVu Sans Mono, Consolas, monospace; }
.title { font-size: 26px; font-weight: 700; }
</style>
<text x="40" y="46" class="title">Suggested IP65 panel layout</text>
<text x="40" y="70" class="s">500 x 400 x 200 mm enclosure; DIN rail and wire duct. Not to scale.</text>
<rect x="50" y="100" width="1100" height="650" rx="12" fill="#fbfcfd" stroke="#33475b" stroke-width="3"/>
<text x="70" y="130" class="b" text-anchor="start">Enclosure front (door removed)</text>
<rect x="80" y="150" width="1040" height="80" rx="6" fill="#f1f4f7" stroke="#7d8b99" stroke-width="2"/>
<text x="90" y="180" class="b" text-anchor="start">DIN rail 1 (power)</text>
<rect x="95" y="190" width="110" height="30" rx="4" fill="#fff4d6" stroke="#c99a2e"/>
<text x="150.0" y="210" class="small" text-anchor="middle">ISOLATOR</text>
<rect x="213" y="190" width="110" height="30" rx="4" fill="#fff4d6" stroke="#c99a2e"/>
<text x="268.0" y="210" class="small" text-anchor="middle">RCCB</text>
<rect x="331" y="190" width="110" height="30" rx="4" fill="#fff4d6" stroke="#c99a2e"/>
<text x="386.0" y="210" class="small" text-anchor="middle">MCB</text>
<rect x="449" y="190" width="124" height="30" rx="4" fill="#fff4d6" stroke="#c99a2e"/>
<text x="511.0" y="210" class="small" text-anchor="middle">CONTACTOR</text>
<rect x="581" y="190" width="124" height="30" rx="4" fill="#fff4d6" stroke="#c99a2e"/>
<text x="643.0" y="210" class="small" text-anchor="middle">OVERLOAD</text>
<rect x="713" y="190" width="110" height="30" rx="4" fill="#fff4d6" stroke="#c99a2e"/>
<text x="768.0" y="210" class="small" text-anchor="middle">PHASE FAIL</text>
<rect x="831" y="190" width="110" height="30" rx="4" fill="#fff4d6" stroke="#c99a2e"/>
<text x="886.0" y="210" class="small" text-anchor="middle">CTRL MCB</text>
<rect x="949" y="190" width="110" height="30" rx="4" fill="#fff4d6" stroke="#c99a2e"/>
<text x="1004.0" y="210" class="small" text-anchor="middle">SMPS 5V</text>
<rect x="80" y="270" width="1040" height="80" rx="6" fill="#f1f4f7" stroke="#7d8b99" stroke-width="2"/>
<text x="90" y="300" class="b" text-anchor="start">DIN rail 2 (control)</text>
<rect x="95" y="310" width="222" height="30" rx="4" fill="#e6f7ec" stroke="#4f9b67"/>
<text x="206.0" y="330" class="small" text-anchor="middle">TERMINALS</text>
<rect x="325" y="310" width="292" height="30" rx="4" fill="#e6f7ec" stroke="#4f9b67"/>
<text x="471.0" y="330" class="small" text-anchor="middle">RELAY 16CH</text>
<rect x="625" y="310" width="82" height="30" rx="4" fill="#e6f7ec" stroke="#4f9b67"/>
<text x="666.0" y="330" class="small" text-anchor="middle">FUSE</text>
<rect x="715" y="310" width="112" height="30" rx="4" fill="#e6f7ec" stroke="#4f9b67"/>
<text x="771.0" y="330" class="small" text-anchor="middle">BUCK 5V</text>
<rect x="835" y="310" width="112" height="30" rx="4" fill="#e6f7ec" stroke="#4f9b67"/>
<text x="891.0" y="330" class="small" text-anchor="middle">LVD</text>
<rect x="955" y="310" width="152" height="30" rx="4" fill="#e6f7ec" stroke="#4f9b67"/>
<text x="1031.0" y="330" class="small" text-anchor="middle">TERMINALS</text>
<rect x="100" y="400" width="300" height="150" rx="10" fill="#e3f0ff" stroke="#4a7fb5" stroke-width="2"/>
<text x="112" y="424" class="b">ESP32 on standoffs</text>
<text x="112" y="445" class="n">Keep antenna edge clear</text>
<text x="112" y="463" class="n">USB port accessible from side</text>
<text x="112" y="481" class="n">Label every GPIO wire</text>
<text x="112" y="499" class="n">Strain relief on all cables</text>
<rect x="430" y="400" width="260" height="150" rx="10" fill="#e6f7ec" stroke="#4f9b67" stroke-width="2"/>
<text x="442" y="424" class="b">RTC + ACS712</text>
<text x="442" y="445" class="n">DS3231 with CR2032</text>
<text x="442" y="463" class="n">ACS712 on L1 only</text>
<text x="442" y="481" class="n">Divider on perf board</text>
<text x="442" y="499" class="n">Keep AC and signal wires apart</text>
<rect x="720" y="400" width="380" height="150" rx="10" fill="#f1f4f7" stroke="#7d8b99" stroke-width="2"/>
<text x="732" y="424" class="b">Cable glands / entries</text>
<text x="732" y="445" class="n">Bottom entry: 3-phase in, pump out</text>
<text x="732" y="463" class="n">Separate gland for sensors</text>
<text x="732" y="481" class="n">Separate gland for antenna/ethernet?</text>
<text x="732" y="499" class="n">Use ferrules and numbered cores</text>
<rect x="100" y="580" width="1000" height="140" rx="10" fill="#fff4d6" stroke="#c99a2e" stroke-width="2"/>
<text x="112" y="604" class="b">12.8 V 6 Ah LiFePO4 battery</text>
<text x="112" y="625" class="n">Place on the bottom of the enclosure or in a separate ventilated box.</text>
<text x="112" y="643" class="n">Fuse the battery positive (5 A). Keep LiFePO4 charger and LVD accessible.</text>
<text x="112" y="661" class="n">Vent the battery compartment and keep the LiFePO4 pack dry.</text>
<rect x="40" y="770" width="1120" height="38" rx="8" fill="#fff4d6" stroke="#c99a2e" stroke-width="1.5"/>
<text x="52" y="792" class="n" text-anchor="start">Keep 230/415 V wiring in its own duct. Signal wiring must not share a duct with mains.</text>
</svg>
