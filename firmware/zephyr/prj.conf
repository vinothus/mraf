# MRAF farm controller - common Zephyr configuration.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=36864
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HTTP_SERVER_STACK_SIZE=8192

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_MAX_CONN=16
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_MAX_NAME_LEN=64
CONFIG_DNS_RESOLVER_MAX_SERVERS=2
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="8.8.8.8"
CONFIG_DNS_SERVER2="1.1.1.1"
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="mraf"
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONFIG_SETTINGS=n

# Logging: expose driver Wi-Fi events on the serial console while debugging.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_WIFI_LOG_LEVEL_DBG=y
CONFIG_NET_MGMT_EVENT_LOG_LEVEL_DBG=y
CONFIG_NET_LOG=y
CONFIG_NET_HTTP_SERVER_LOG_LEVEL_DBG=y
CONFIG_NET_DHCPV4_SERVER_LOG_LEVEL_DBG=y

# Wi-Fi: simultaneous AP+STA on ESP32 (app manages STA retries/fallback)
CONFIG_WIFI_USAGE_MODE_STA_AP=y
CONFIG_ESP32_WIFI_STA_RECONNECT=n
CONFIG_ESP32_WIFI_DEBUG_PRINT=y

# HTTP server
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_VERSION_2=n
CONFIG_HTTP_SERVER_VERSION_3=n
CONFIG_HTTP_SERVER_CAPTURE_HEADERS=y
CONFIG_HTTP_SERVER_MAX_CLIENTS=4
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=1024
CONFIG_MRAF_HTTP_RESP_MAX=16384
CONFIG_BASE64=y


# Time
CONFIG_SNTP=y

# Wi-Fi events (softAP start, scan results, connect/disconnect) are raised as
# net_mgmt events. The default event queue is 5 entries with a 10 ms put
# timeout, and a scan raises one event per AP found: the queue overflows and
# silently drops events (symptom: "0 networks found", softAP event lost).
# Widen the queue and give puts room to wait instead of dropping.
# (Running handlers synchronously in the raiser context was tried and is NOT
# safe here: the ESP32 driver raises events from its own Wi-Fi task, and our
# handlers take network-stack locks the main loop also needs, risking a
# deadlock right at softAP bring-up.)
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=32
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=100

# The ESP32 takes its internal Wi-Fi buffers from the system heap. The
# defaults (32 RX + 32 TX) eat ~100 KiB and starve the JSON work the dashboard
# does on every save/status poll (ArduinoJson then fails with "out of
# memory"). 16 buffers are plenty for the dashboard.
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=16
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=16

# Application features
CONFIG_MRAF_MCP=y
