# qemu_x86: run the MRAF application under upstream QEMU with a real
# Ethernet stack. The emulated intel,e1000 NIC is bridged through QEMU's
# user networking (slirp), and guest port 80 is forwarded to host 18083 so
# the dashboard is reachable from the development machine.
CONFIG_MRAF_PLATFORM_NATIVE=y
CONFIG_MRAF_SIMULATOR=y
CONFIG_MRAF_HTTP_PORT=80

CONFIG_NET_QEMU_USER=y
CONFIG_NET_QEMU_USER_EXTRA_ARGS="hostfwd=tcp::18083-:80"
CONFIG_NET_DHCPV4=y
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_REBOOT=y
