# ESP32 target-specific configuration for the MRAF controller.
CONFIG_MRAF_HTTP_PORT=80
CONFIG_MRAF_SIMULATOR=n
CONFIG_MRAF_NTP_SERVER="pool.ntp.org"

# Keep .noinit in the second DRAM bank. MCUboot builds would otherwise spill
# it into dram0 and overflow the 192 KiB bank.
CONFIG_ESP32_REGION_1_NOINIT=y

# Wi-Fi station + access point coexistence (app-managed STA retries/fallback)
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_WIFI_NM=y
CONFIG_WIFI_USAGE_MODE_STA_AP=y
CONFIG_ESP32_WIFI_AP_STA_MODE=y
CONFIG_ESP32_WIFI_STA_RECONNECT=n
# Fast scan stops at the first matching AP; routers with more than one BSSID
# (extender/mesh) or a weak primary can then be reported as NO_AP_FOUND (201).
CONFIG_ESP32_WIFI_STA_SCAN_ALL=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_CONNECTION_MANAGER=n
CONFIG_ZVFS_POLL_MAX=8

# mDNS / DNS-SD
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y
CONFIG_MDNS_RESPONDER_DNS_SD=y

# Persistence
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# The Espressif Wi-Fi/WPA supplicant sources need a complete C library
# (fopen/fgets/fclose and mktime), which minimal libc does not provide.
CONFIG_REQUIRES_FULL_LIBC=y

# Hardware
CONFIG_ADC=y
CONFIG_MFD=y
CONFIG_MFD_DS3231=y
CONFIG_RTC=y
CONFIG_RTC_DS3231=y
CONFIG_GPIO=y
CONFIG_HWINFO=y

# Ensure stacks are large enough for settings/JSON handling on ESP32.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HTTP_SERVER_STACK_SIZE=8192
