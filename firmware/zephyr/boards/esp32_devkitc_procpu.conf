# ESP32 target-specific configuration for the MRAF controller.
CONFIG_MRAF_HTTP_PORT=80
CONFIG_MRAF_SIMULATOR=n
CONFIG_MRAF_NTP_SERVER="pool.ntp.org"

# Wi-Fi station + access point coexistence
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_WIFI_NM=y
CONFIG_WIFI_USAGE_MODE_STA_AP=y
CONFIG_ESP32_WIFI_AP_STA_MODE=y
CONFIG_ESP32_WIFI_STA_RECONNECT=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_CONNECTION_MANAGER=n
CONFIG_ZVFS_POLL_MAX=8

# mDNS / DNS-SD
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y
CONFIG_MDNS_RESPONDER_DNS_SD=y

# Persistence
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# Hardware
CONFIG_ADC=y
CONFIG_MFD=y
CONFIG_MFD_DS3231=y
CONFIG_RTC=y
CONFIG_RTC_DS3231=y
CONFIG_GPIO=y
CONFIG_HWINFO=y
