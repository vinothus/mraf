# native_sim test target configuration for the MRAF controller.
CONFIG_MRAF_HTTP_PORT=8080
CONFIG_MRAF_SIMULATOR=y
CONFIG_MRAF_SETTINGS_PATH="mraf-settings.json"
CONFIG_MRAF_NTP_SERVER="pool.ntp.org"

# Use the host's socket stack instead of a simulated Ethernet driver.
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS=y
CONFIG_ZVFS_POLL_MAX=8
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_IPV6_DAD=n
CONFIG_NET_DHCPV4=n
CONFIG_NET_CONFIG_NEED_IPV4=n
CONFIG_NET_CONFIG_NEED_IPV6=n
CONFIG_NET_CONNECTION_MANAGER=n
CONFIG_REBOOT=y

# No L2 interface exists for mDNS with offloaded sockets.
CONFIG_MDNS_RESPONDER=n
CONFIG_DNS_SD=n
CONFIG_SNTP=n
