# Optional build fragment: enable the WireGuard overlay on the ESP32 target.
#
#   west build -b esp32_devkitc/esp32/procpu \
#       -- -DEXTRA_CONF_FILE=wireguard.conf
#
# The server pushes a complete tunnel description over CoAP; when this fragment
# is present the device installs it into the Zephyr network stack (see
# mraf_platform_wireguard_apply()). The default build stores the configuration
# but does not bring the tunnel up, which keeps the flash image small.

CONFIG_MRAF_WIREGUARD=y

# WireGuard service. One peer (the MRAF server) and one allowed /24.
CONFIG_WIREGUARD=y
CONFIG_WIREGUARD_MAX_PEER=1
CONFIG_WIREGUARD_MAX_SRC_IPS=1

# The VPN traffic needs a few extra interfaces and buffers on top of the
# Wi-Fi station + softAP pair.
CONFIG_NET_IF_MAX_IPV4_COUNT=3
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=2
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32

# Crypto used by the WireGuard handshake.
CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG=n
